<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>FocusFrog</title>
    <link rel="icon" type="image/svg+xml" href="/focusfrog-logo.svg" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <!-- Verify with https://csp-evaluator.withgoogle.com/ -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' <%= htmlWebpackPlugin.options.templateParameters.cspDefaultSrc %> https://api.github.com/repos/ActivityWatch/activitywatch/releases/latest; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; script-src 'self' 'unsafe-eval'"
    />
  </head>
  <body>
    <noscript>
      <strong
        >We're sorry but FocusFrog doesn't work properly without JavaScript enabled. Please enable
        it to continue.</strong
      >
    </noscript>
    <div id="app"></div>
    <!-- We can build the app with either Vite or Webpack, they inject in different ways -->
    <!-- Vite will auto-inject here: VITE_AUTOINJECT -->
  </body>
</html>
